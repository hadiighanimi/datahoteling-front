<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loader Centered</title>
  <style>
 
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;  
      justify-content: center;
      align-items: center;
      background: #ffffff;
      color: #3a717d;
      font-family: Tahoma, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }


    .message-box {
    

      padding: 14px 20px;
      margin-bottom: 60px;
      font-size: 1.05 rem;
      font-weight: 550;
      color:#3a717d;
      text-align: center;
      min-width: 240px;
      max-width: 90%;
      letter-spacing: 0.2px;
    }



    .lds-roller, .lds-roller div, .lds-roller div:after { box-sizing: border-box; }
    .lds-roller {
      display: block;
      position: relative;
      width: 100px;
      height: 100px;
      transform: scale(1.5); 
      color: #3a717d; 
    }
    .lds-roller div {
      animation: lds-roller 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      transform-origin: 40px 40px;
    }
    .lds-roller div:after {
      content: "";
      display: block;
      position: absolute;
      width: 9px;  
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      margin: -3.6px 0 0 -3.6px;
    }
    .lds-roller div:nth-child(1) { animation-delay: -0.036s; }
    .lds-roller div:nth-child(1):after { top: 62.62742px; left: 62.62742px; }
    .lds-roller div:nth-child(2) { animation-delay: -0.072s; }
    .lds-roller div:nth-child(2):after { top: 67.71281px; left: 56px; }
    .lds-roller div:nth-child(3) { animation-delay: -0.108s; }
    .lds-roller div:nth-child(3):after { top: 70.90963px; left: 48.28221px; }
    .lds-roller div:nth-child(4) { animation-delay: -0.144s; }
    .lds-roller div:nth-child(4):after { top: 72px; left: 40px; }
    .lds-roller div:nth-child(5) { animation-delay: -0.18s; }
    .lds-roller div:nth-child(5):after { top: 70.90963px; left: 31.71779px; }
    .lds-roller div:nth-child(6) { animation-delay: -0.216s; }
    .lds-roller div:nth-child(6):after { top: 67.71281px; left: 24px; }
    .lds-roller div:nth-child(7) { animation-delay: -0.252s; }
    .lds-roller div:nth-child(7):after { top: 62.62742px; left: 17.37258px; }
    .lds-roller div:nth-child(8) { animation-delay: -0.288s; }
    .lds-roller div:nth-child(8):after { top: 56px; left: 12.28719px; }

    @keyframes lds-roller { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 420px){
      .message-box{ font-size: 0.95rem; padding: 12px 14px; }
      .lds-roller{ transform: scale(1.2); }
    }
  </style>
</head>
<body>


  <div class="lds-roller">
    <div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div>
  </div>
  <div class="message-box"> ...درحال انتقال به درگاه پرداخت</div>
</body>
</html>
