<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>private host</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <div class="container-main">
      <div id="nav-bar-placeholder"></div>

      <div class="dashboard-container">
        <div id="sidebar-placeholder"></div>
      </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        async function loadComponent(placeholderId, filePath) {
          try {
            const response = await fetch(filePath);
            if (!response.ok) throw new Error("فایل یافت نشد: " + filePath);
            const html = await response.text();
            document.getElementById(placeholderId).innerHTML = html;
            initializeEvents(); // فراخوانی بعد از بارگذاری هر کامپوننت
          } catch (error) {
            console.log(" ");
          }
        }

        function initializeEvents() {
          const dropdownToggles = document.querySelectorAll(
            ".sidebar-menu .dropdown-toggle"
          );

          dropdownToggles.forEach((toggle) => {
            toggle.removeEventListener("click", handleDropdownToggle);
            toggle.addEventListener("click", handleDropdownToggle);
          });

          const menuToggle = document.getElementById("menu-toggle");
          const sidebar = document.getElementById("sidebar-menu");
          const mobileOverlay = document.getElementById("mobile-overlay");

          if (menuToggle && sidebar && mobileOverlay) {
            menuToggle.removeEventListener("click", handleMenuToggle);
            menuToggle.addEventListener("click", handleMenuToggle);

            mobileOverlay.removeEventListener("click", handleMobileOverlay);
            mobileOverlay.addEventListener("click", handleMobileOverlay);
          }

          document
            .querySelectorAll(".sidebar-menu .menu-item.current")
            .forEach((item) => {
              if (item.classList.contains("has-dropdown")) {
                item.classList.add("open");
                const dropdownMenu = item.querySelector(".dropdown-menu");
                if (dropdownMenu) {
                  dropdownMenu.style.maxHeight =
                    dropdownMenu.scrollHeight + "px";
                }
              }
            });
        }

        function handleDropdownToggle(event) {
          const toggle = event.currentTarget;
          const parentLi = toggle.closest(".menu-item");

          // اگر آیتم والد دارای دراپ‌داون است (has-dropdown)
          if (parentLi && parentLi.classList.contains("has-dropdown")) {
            event.preventDefault();

            const dropdownMenu = parentLi.querySelector(".dropdown-menu");

            // 1. اگر آیتم جاری قبلا باز بوده، آن را ببند.
            if (parentLi.classList.contains("open")) {
              parentLi.classList.remove("open");
              if (dropdownMenu) {
                dropdownMenu.style.maxHeight = "0";
              }
            } else {
              // 2. اگر بسته بوده، بازش کن و بقیه را ببند.

              // بستن همه دراپ‌داون‌های دیگر
              document
                .querySelectorAll(".sidebar-menu .menu-item.open")
                .forEach((otherLi) => {
                  otherLi.classList.remove("open");
                  const otherDropdown = otherLi.querySelector(".dropdown-menu");
                  if (otherDropdown) {
                    otherDropdown.style.maxHeight = "0";
                  }
                });

              // باز کردن دراپ‌داون جاری
              parentLi.classList.add("open");
              if (dropdownMenu) {
                // استفاده از scrollHeight برای انیمیشن کشویی
                dropdownMenu.style.maxHeight = dropdownMenu.scrollHeight + "px";
              }
            }
          } else if (parentLi && !parentLi.classList.contains("has-dropdown")) {
            // این بخش برای لینک‌های ساده است. فقط بقیه دراپ‌داون‌های باز را می‌بندد.
            document
              .querySelectorAll(".sidebar-menu .menu-item.open")
              .forEach((otherLi) => {
                otherLi.classList.remove("open");
                const otherDropdown = otherLi.querySelector(".dropdown-menu");
                if (otherDropdown) {
                  otherDropdown.style.maxHeight = "0";
                }
              });
          }
        }
        function handleMenuToggle() {
          const sidebar = document.getElementById("sidebar-menu");
          const mobileOverlay = document.getElementById("mobile-overlay");

          if (sidebar && mobileOverlay) {
            sidebar.classList.toggle("active");
            mobileOverlay.classList.toggle("active");
          }
        }

        function handleMobileOverlay() {
          const sidebar = document.getElementById("sidebar-menu");
          const mobileOverlay = document.getElementById("mobile-overlay");

          if (sidebar && mobileOverlay) {
            sidebar.classList.remove("active");
            mobileOverlay.classList.remove("active");
          }
        }

        Promise.all([
          loadComponent("nav-bar-placeholder", "components/navbar.html"),
          loadComponent("sidebar-placeholder", "components/sidebar.html"),
        ])
          .then(() => {
            highlightCurrentPage();
            initializeEvents();
          })
          .catch((error) => {
            console.error(error);
          });
      });

      function highlightCurrentPage() {
        const currentPath = window.location.pathname
          .split("/")
          .pop()
          .split(".")[0];

        const sidebarLinks = document.querySelectorAll("#sidebar-menu a");

        sidebarLinks.forEach((link) => {
          const classValue = link.classList[0];
          if (classValue === currentPath) {
            document
              .querySelectorAll(".sidebar-menu .current")
              .forEach((el) => {
                el.classList.remove("current");
              });

            link.closest(".dropdown-toggle").classList.add("current");
          }
        });
      }
    </script>
  </body>
</html>
