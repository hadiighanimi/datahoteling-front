<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود و ثبت‌نام | Data Hoteling</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --primary: #3050a9;
      --secondary: #5dc2d9;
      --dark: #0f3360;
      --light: #f4f4f9;
      --card-bg: rgba(255, 255, 255, 0.15);
      --input-bg: rgba(255, 255, 255, 0.2);
      --input-bg-focus: rgba(255, 255, 255, 0.3);
      --border: rgba(255, 255, 255, 0.3);
      --focus: 0 0 0 4px rgba(93, 194, 217, 0.3);
      --error: #e74c3c;
      --success: #27ae60;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.75);
      --label-active: #5dc2d9;
      --tab-bg: rgba(255, 255, 255, 0.15);
      --tab-active: #ffffff;
    }

    @font-face {
      font-family: Vazir;
      src: url('/assets/font/vazirmatn/Vazir-FD-WOL.ttf') format('truetype');
      font-weight: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Vazir', sans-serif;
    }

    body {
      background: linear-gradient(to right, #2c7282, #4e8293, #76a6ae, #e1eff9);
      min-height: 100dvh;
      direction: rtl;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text);
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
      /* اسکرول عمودی همیشه فعال */
    }

    /* فقط وقتی منو باز باشه، اسکرول قفل بشه */
    .no-scroll {
      overflow: hidden !important;
    }

    /* بک‌گراند دایره‌های متحرک */
    .circles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .circles>li {
      position: absolute;
      display: block;
      list-style: none;
      width: 20px;
      height: 20px;
      background: #144679;
      background-image: linear-gradient(225deg, #386593 0%, #144679 50%, #08213a 100%);
      animation: animate 25s linear infinite;
      bottom: -150px;
      border-radius: 0;
    }

    .circles>li:nth-child(1) {
      left: 25%;
      width: 80px;
      height: 80px;
      animation-delay: 0s;
    }

    .circles>li:nth-child(2) {
      left: 10%;
      width: 20px;
      height: 20px;
      animation-delay: 2s;
      animation-duration: 15s;
    }

    .circles>li:nth-child(3) {
      left: 70%;
      width: 20px;
      height: 20px;
      animation-delay: 4s;
    }

    .circles>li:nth-child(4) {
      left: 40%;
      width: 60px;
      height: 60px;
      animation-delay: 0s;
      animation-duration: 20s;
    }

    .circles>li:nth-child(5) {
      left: 65%;
      width: 20px;
      height: 20px;
      animation-delay: 0s;
    }

    .circles>li:nth-child(6) {
      left: 75%;
      width: 110px;
      height: 110px;
      animation-delay: 3s;
    }

    .circles>li:nth-child(7) {
      left: 35%;
      width: 150px;
      height: 150px;
      animation-delay: 7s;
    }

    .circles>li:nth-child(8) {
      left: 50%;
      width: 25px;
      height: 25px;
      animation-delay: 15s;
      animation-duration: 50s;
    }

    .circles>li:nth-child(9) {
      left: 20%;
      width: 15px;
      height: 15px;
      animation-delay: 2s;
      animation-duration: 40s;
    }

    .circles>li:nth-child(10) {
      left: 85%;
      width: 150px;
      height: 150px;
      animation-delay: 0s;
      animation-duration: 20s;
    }

    .circles>li:nth-child(11) {
      left: 75%;
      width: 150px;
      height: 150px;
      animation-delay: 1s;
      animation-duration: 30s;
    }

    .circles>li:nth-child(12) {
      left: 45%;
      width: 150px;
      height: 150px;
      animation-delay: 3s;
      animation-duration: 20s;
    }

    .circles>li:nth-child(13) {
      left: 35%;
      width: 150px;
      height: 150px;
      animation-delay: 5s;
      animation-duration: 26s;
    }

    .circles>li:nth-child(14) {
      left: 25%;
      width: 150px;
      height: 150px;
      animation-delay: 8s;
      animation-duration: 25s;
    }

    .circles>li:nth-child(15) {
      left: 15%;
      width: 150px;
      height: 150px;
      animation-delay: 4s;
      animation-duration: 15s;
    }

    @keyframes animate {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
        border-radius: 0;
      }

      100% {
        transform: translateY(-1000px) rotate(720deg);
        opacity: 0;
        border-radius: 50%;
      }
    }

    ::-webkit-scrollbar {
      width: 2px;
    }

    ::-webkit-scrollbar-track {
      background-color: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background-color: rgba(60, 251, 251, 0.527);
      border-radius: 15px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: rgba(60, 251, 251, 0.8);
    }

    /* کارت شیشه‌ای */
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      z-index: 1;
    }

    .card-header {
      text-align: center;
      padding: 32px 32px 0;
    }

    .card-header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #0f3360ff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .card-header p {
      color: var(--muted);
      margin-top: 6px;
      font-weight: 500;
    }

    .tabs {
      margin: 24px 32px 16px;
      display: flex;
      background: var(--tab-bg);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 14px 0;
      cursor: pointer;
      font-weight: 600;
      z-index: 2;
      position: relative;
      color: rgba(255, 255, 255, 0.85);
      transition: color 0.3s ease;
    }

    .tab.active {
      color: var(--tab-active);
    }

    .indicator {
      position: absolute;
      top: 6px;
      bottom: 6px;
      right: 6px;
      width: calc(50% - 12px);
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 12px;
      transition: right 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 1;
      box-shadow: 0 4px 15px rgba(48, 80, 169, 0.3);
    }

    .tab[data-tab="signup"].active~.indicator {
      right: calc(50% + 6px);
    }

    .forms {
      padding: 0 32px 32px;
    }

    form {
      display: none;
      flex-direction: column;
      gap: 18px;
      animation: fadeIn 0.4s ease;
    }

    form.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* فیلدهای ورودی */
    .field {
      position: relative;
      height: 58px;
    }

    .field input {
      width: 100%;
      height: 100%;
      padding: 16px 50px 0 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: var(--input-bg);
      font-size: 1rem;
      text-align: right;
      color: #0f3360ff;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .field input::placeholder {
      color: transparent;
    }

    .field input:focus {
      border-color: #0f3360ff;
      background: var(--input-bg-focus);
      box-shadow: var(--focus);
      outline: none;
    }

    .field label {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.95rem;
      transition: all 0.3s ease;
      pointer-events: none;
      padding: 0 6px;
      font-weight: 500;
    }

    .field input:focus+label,
    .field input:not(:placeholder-shown)+label {
      top: 10px;
      font-size: 0.75rem;
      color: #0f3360ff;
      font-weight: 600;
      background: transparent;
    }

    .field i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.7);
      transition: color 0.3s ease;
    }

    .field input:focus~i {
      color: #0f3360ff;
    }

    .password-toggle {
      cursor: pointer;
    }

    .password-toggle:hover {
      color: #0f3360ff;
    }

    .submit button {
      width: 100%;
      height: 58px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(48, 80, 169, 0.3);
      overflow: hidden;
      position: relative;
      font-size: 1.1rem;
    }

    .submit button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transition: 0.6s;
    }

    .submit button:hover::before {
      left: 100%;
    }

    .submit button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(48, 80, 169, 0.4);
    }

    #msg {
      padding: 0 32px 16px;
      min-height: 40px;
      text-align: center;
    }

    .message {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      animation: fadeIn 0.3s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .error {
      background: rgba(231, 76, 60, 0.2);
      color: #ff6b6b;
    }

    .success {
      background: rgba(39, 174, 96, 0.2);
      color: #90ee90;
    }

    /* ریسپانسیو موبایل */
    @media (max-width: 480px) {
      body {
        padding: 8px;
        min-height: 100dvh;
      }

      .card {
        max-width: 100%;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      .card-header {
        padding: 24px 20px 0;
      }

      .card-header h1 {
        font-size: 1.6rem;
      }

      .card-header p {
        font-size: 0.9rem;
      }

      .tabs {
        margin: 16px 20px;
        border-radius: 12px;
      }

      .tab {
        padding: 12px 0;
        font-size: 0.95rem;
      }

      .forms {
        padding: 0 20px 24px;
      }

      .field {
        height: 54px;
      }

      .field input {
        padding: 14px 48px 0 14px;
        font-size: 0.95rem;
      }

      .field label {
        font-size: 0.9rem;
        right: 14px;
      }

      .field input:focus+label,
      .field input:not(:placeholder-shown)+label {
        top: 8px;
        font-size: 0.7rem;
      }

      .submit button {
        height: 52px;
        font-size: 1rem;
      }

      /* دایره‌های پس‌زمینه در موبایل */
      .circles>li {
        width: 15px !important;
        height: 15px !important;
        animation-duration: 30s !important;
      }

      .circles>li:nth-child(odd) {
        width: 30px !important;
        height: 30px !important;
      }

      .circles>li:nth-child(even) {
        width: 20px !important;
        height: 20px !important;
      }
    }
  </style>
</head>

<body>

  <ul class="circles">
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
    <li></li>
  </ul>

  <div class="card">
    <div class="card-header">
      <h1>Data Hoteling</h1>
      <p>مدیریت هوشمند داده‌های شما</p>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="login">ورود</div>
      <div class="tab" data-tab="signup">ثبت‌نام</div>
      <div class="indicator"></div>
    </div>

    <div id="msg"></div>

    <div class="forms">
      <!-- فرم ورود -->
      <form id="loginForm" class="active" novalidate>
        <div class="field">
          <input type="text" id="loginEmail" placeholder=" " required>
          <label>ایمیل، نام کاربری یا شماره موبایل</label>
          <i class="fas fa-user"></i>
        </div>
        <div class="field">
          <input type="password" id="loginPass" placeholder=" " required>
          <label>رمز عبور</label>
          <i class="fas fa-eye password-toggle" onclick="togglePass('loginPass', this)"></i>
        </div>
        <div class="submit"><button type="submit">ورود</button></div>
      </form>

      <!-- فرم ثبت‌نام -->
      <form id="signupForm" novalidate>
        <div class="field">
          <input type="text" id="fullName" placeholder=" " required>
          <label>نام و نام خانوادگی</label>
          <i class="fas fa-user"></i>
        </div>
        <div class="field">
          <input type="text" id="username" placeholder=" " required>
          <label>نام کاربری</label>
          <i class="fas fa-at"></i>
        </div>
        <div class="field">
          <input type="email" id="email" placeholder=" " required>
          <label>ایمیل</label>
          <i class="fas fa-envelope"></i>
        </div>
        <div class="field">
          <input type="tel" id="phone" placeholder=" " pattern="[0-9]{11}" required>
          <label>شماره تماس (۱۱ رقم)</label>
          <i class="fas fa-phone"></i>
        </div>
        <div class="field">
          <input type="password" id="pass" placeholder=" " required>
          <label>رمز عبور</label>
          <i class="fas fa-eye password-toggle" onclick="togglePass('pass', this)"></i>
        </div>
        <div class="field">
          <input type="password" id="confirmPass" placeholder=" " required>
          <label>تکرار رمز عبور</label>
          <i class="fas fa-eye password-toggle" onclick="togglePass('confirmPass', this)"></i>
        </div>
        <div class="submit"><button type="submit">ثبت‌نام</button></div>
      </form>
    </div>
  </div>

  <script>
    // تب‌ها و فرم‌ها
    const tabs = document.querySelectorAll('.tab');
    const forms = document.querySelectorAll('form');
    const msg = document.getElementById('msg');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        forms.forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
      });
    });

    function showMessage(text, type) {
      msg.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => msg.innerHTML = '', 5000);
    }

    function togglePass(id, icon) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
      icon.classList.toggle('fa-eye');
      icon.classList.toggle('fa-eye-slash');
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function isValidPhone(phone) {
      return /^09[0-9]{9}$/.test(phone);
    }

    function toLower(str) {
      return str.toLowerCase();
    }

    // ثبت‌نام
    const signupForm = document.getElementById('signupForm');
    signupForm.addEventListener('submit', e => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const pass = document.getElementById('pass').value;
      const confirmPass = document.getElementById('confirmPass').value;

      if (!fullName || !username || !email || !phone || !pass) {
        return showMessage('همه فیلدها الزامی هستند', 'error');
      }

      if (!isValidEmail(email)) {
        return showMessage('ایمیل معتبر نیست', 'error');
      }

      if (!isValidPhone(phone)) {
        return showMessage('شماره موبایل باید ۱۱ رقم و با ۰۹ شروع شود', 'error');
      }

      if (pass.length < 6) {
        return showMessage('رمز عبور باید حداقل ۶ کاراکتر باشد', 'error');
      }

      if (pass !== confirmPass) {
        return showMessage('رمزهای عبور مطابقت ندارند', 'error');
      }

      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const lowerEmail = toLower(email);
      const lowerUsername = toLower(username);

      const exists = users.some(u =>
        toLower(u.email) === lowerEmail ||
        toLower(u.username) === lowerUsername
      );

      if (exists) {
        return showMessage('نام کاربری یا ایمیل قبلاً ثبت شده است', 'error');
      }

      const newUser = { fullName, username, email, phone, password: pass };
      users.push(newUser);
      localStorage.setItem('users', JSON.stringify(users));

      showMessage(`ثبت‌نام موفق بود، ${fullName} عزیز!`, 'success');
      signupForm.reset();
      document.querySelectorAll('.field input').forEach(input => input.classList.remove('not-empty'));

      setTimeout(() => {
        document.querySelector('[data-tab="login"]').click();
      }, 1500);
    });

    // ورود
    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', e => {
      e.preventDefault();

      const loginInput = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value;

      if (!loginInput || !password) {
        return showMessage('ورودی و رمز عبور الزامی است', 'error');
      }

      const users = JSON.parse(localStorage.getItem('users') || '[]');
      const lowerInput = toLower(loginInput);

      const user = users.find(u => {
        const isEmailMatch = toLower(u.email) === lowerInput;
        const isUsernameMatch = toLower(u.username) === lowerInput;
        const isPhoneMatch = u.phone === loginInput;
        return (isEmailMatch || isUsernameMatch || isPhoneMatch) && u.password === password;
      });

      if (!user) {
        return showMessage('اطلاعات ورود اشتباه است', 'error');
      }

      localStorage.setItem('currentUser', JSON.stringify(user));
      showMessage(`خوش آمدید، ${user.fullName}!`, 'success');

      setTimeout(() => {
        window.location.href = '../login/services.html';
      }, 1500);
    });

    // لیبل‌ها
    document.querySelectorAll('.field input').forEach(input => {
      input.addEventListener('input', () => {
        input.classList.toggle('not-empty', input.value.trim() !== '');
      });
      if (input.value) input.classList.add('not-empty');
    });

    // --- مدیریت اسکرول در موبایل (درست شده) ---
    const body = document.body;
    const hamburgerMenu = document.querySelector('.hamburger-menu');

    const handleScroll = () => {
      if (hamburgerMenu && hamburgerMenu.classList.contains('active')) {
        body.classList.add('no-scroll');
      } else {
        body.classList.remove('no-scroll');
      }
    };

    window.addEventListener('resize', handleScroll);
    window.addEventListener('load', handleScroll);
    handleScroll();
  </script>
</body>

</html>
